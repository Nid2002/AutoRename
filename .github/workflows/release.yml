name: Release AutoRename

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  release:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller AutoRename.spec --noconfirm

      - name: Create ZIP (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r AutoRename-Linux.zip *

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist\* -DestinationPath AutoRename-Windows.zip

      - name: Upload Release Asset (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoRename-Linux.zip

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: AutoRename-Windows.zip
